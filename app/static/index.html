<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copilot Demo — Task Tracker</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0d1117; color:#e6edf3;
         margin:0; display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:640px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:#8b949e; margin:0 0 24px; font-size:14px; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input, select, button { font:inherit; border-radius:6px; border:1px solid #30363d;
         background:#161b22; color:#e6edf3; padding:8px 10px; }
  input { flex:1; }
  button { background:#238636; border-color:#2ea043; cursor:pointer; font-weight:600; }
  button:hover { background:#2ea043; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:10px; border:1px solid #30363d;
       border-radius:6px; padding:10px 12px; margin-bottom:8px; background:#161b22; }
  li .title { flex:1; }
  li.done .title { text-decoration:line-through; color:#8b949e; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid #30363d; color:#8b949e; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters button { background:#21262d; border-color:#30363d; font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Task Tracker</h1>
  <p class="sub">A tiny FastAPI app for the GitHub Copilot demo.</p>

  <form id="new-task">
    <input id="title" placeholder="What needs doing?" autocomplete="off" />
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="filters">
    <button data-filter="">All</button>
    <button data-filter="open">Open</button>
    <button data-filter="done">Done</button>
  </div>
  <p class="sub" id="stats"></p>

  <ul id="list"></ul>
</main>

<script>
let filter = "";

async function loadStats() {
  const stats = await (await fetch("/tasks/stats")).json();
  document.getElementById("stats").textContent = `Open: ${stats.open} • Done: ${stats.done}`;
}

async function refreshView() {
  await load();
  await loadStats();
}

async function load() {
  const qs = filter ? `?status=${filter}` : "";
  const tasks = await (await fetch(`/tasks${qs}`)).json();
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const t of tasks) {
    const li = document.createElement("li");
    const isDone = t.status === "done";
    if (isDone) li.className = "done";
    const action = isDone ? "Reopen" : "Done";
    const endpoint = isDone ? "reopen" : "complete";
    li.innerHTML = `<span class="title"></span>
                    <span class="pill">${t.priority}</span>
                    <button data-id="${t.id}">${action}</button>`;
    li.querySelector(".title").textContent = t.title;
    li.querySelector("button").onclick = async () => {
      await fetch(`/tasks/${t.id}/${endpoint}`, { method: "POST" });
      await refreshView();
    };
    list.appendChild(li);
  }
}

document.getElementById("new-task").onsubmit = async (e) => {
  e.preventDefault();
  const title = document.getElementById("title").value;
  const priority = document.getElementById("priority").value;
  await fetch("/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, priority }),
  });
  document.getElementById("title").value = "";
  await refreshView();
};

for (const b of document.querySelectorAll(".filters button")) {
  b.onclick = async () => { filter = b.dataset.filter; await refreshView(); };
}

refreshView();
</script>
</body>
</html>
